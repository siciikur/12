.video-box video{
  width:100%;
  height:100%;

}
.poster{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
}

/* Sembunyikan poster, tombol play, dan popup saat video dimainkan */
.video-box.playing .poster,
.video-box.playing .play-button,
.video-box.playing .custom-popup {display:none}

.play-button{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:118px;
  height:118px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.95);
  cursor:pointer;
  z-index: 2;
}
.play-button:after{
  content:"";
  position:absolute;
  left:48%;
  top:37%;
  border-left:32px solid #111;
  border-top:21px solid transparent;
  border-bottom:21px solid transparent;
}

/* Styling Custom Popup persis seperti gambar */

  inset: 20px;
  background: rgba(26, 26, 26, 0.95);

  z-index: 3;

.popup-title {

/* Styling untuk wadah iklan agar rapi dan tidak mengganggu */

<body>

<div class="page">

  <header class="header">
    <div class="brand">
      <div class="logo">V</div>
      <span>vldey<span class="co">.co</span></span>
    </div>

    <div class="actions">
      <a class="wa"
         href="https://videy.it.com"
         target="_blank"
         rel="noopener noreferrer">
        WEB UTAMA
      </a>

      <button class="upload" onclick="document.getElementById('fileInput').click()">
        Upload
      </button>
      <input id="fileInput" type="file" accept="video/*" hidden>
    </div>
  </header>

  <div class="ad">WEB UTAMA BANYAK PILIHAN</div>

  <section class="video-box" id="videoBox">
    <video id="video" controls playsinline preload="metadata">
      <source src="https://videy.it.com/videos/jatah mantan.mp4" type="video/mp4">
    </video>

    <img class="poster" src="poster.png" alt="Preview video">
    <button class="play-button" id="playButton" aria-label="Putar video"></button>

    <!-- Kotak Pop-up Tampilan Sesuai Gambar -->
    <div class="custom-popup" id="customPopup">
      <div class="popup-title">Klik Di Mana Saja untuk Memulai Film</div>
      <div class="popup-desc">"Terima kasih sudah mengklik ku 1 kali, untuk menampilkan iklan dan <b>Play Movie</b>, mudah rezeki dan sehat terus buat kamu. Aamiin"</div>
      <div class="popup-badge">THIS PLAYER CONTAINS ADS</div>
    </div>
  </section>

  <!-- Penempatan Iklan Banner / Kotak yang rapi di bawah video -->
  <div class="ad-container">
    <script>
      atOptions = {
        'key' : 'fe355af9a8cd79f7503570c4a608593b',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
      };
    </script>
    <script src="https://www.highrevenueformat.com/fe355af9a8cd79f7503570c4a608593b/invoke.js"></script>
  </div>

  <!-- Skrip iklan tambahan diletakkan dengan aman di bagian bawah agar tidak mengganggu layout -->

    <script async="async" data-cfasync="false" src="https://pl31718116.profitableratecpmnetwork.com/3a1065c5a29a13ae4b01c54778ef68e0/invoke.js"></script>
    <div id="container-3a1065c5a29a13ae4b01c54778ef68e0"></div>
  </div>

  <!-- Skrip iklan bawah diperbaiki syntax-nya agar tidak error -->
  <div style="text-align:center; margin: 10px 0;">
    <script src="https://pl32367010.profitableratecpmnetwork.com/26/df/67/26df673a455e2ad418b986584e6ea89b.js"></script>
  </div>

  <div class="note">Video Player</div>
</div>

<script>
const box = document.getElementById('videoBox');
const video = document.getElementById('video');
const popup = document.getElementById('customPopup');
const playButton = document.getElementById('playButton');
const poster = document.querySelector('.poster');
const fileInput = document.getElementById('fileInput');

// URL tautan redirect iklan saat tombol / kotak diklik pertama kali
const redirectUrl = "https://uplcm.com/4/11506355";
let isFirstClick = true;

function startVideo(e){
  if (isFirstClick) {
    isFirstClick = false;
    // Membuka iklan di tab baru
    window.open(redirectUrl, '_blank');
  }

  box.classList.add('playing');
  try { 
    video.play().catch(e => {}); 
  } catch(e) {}
}

// Menghubungkan fungsi klik pada area popup, poster, maupun tombol play
popup.addEventListener('click', startVideo);
playButton.addEventListener('click', startVideo);
poster.addEventListener('click', startVideo);

video.addEventListener('play', () => box.classList.add('playing'));
video.addEventListener('pause', () => {
  if (!video.ended) box.classList.remove('playing');
});
video.addEventListener('ended', () => box.classList.remove('playing'));

fileInput.addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  video.src = url;
  box.classList.add('playing');
  video.play().catch(()=>{});
});
</script>
